spring.application.name=courtly
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/courtly}
spring.datasource.username=${DB_USERNAME:courtly}
spring.datasource.password=${DB_PASSWORD:courtly}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
